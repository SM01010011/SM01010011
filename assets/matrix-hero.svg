<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-label="Swarit Mathur — cybersecurity and Python">
<title>Swarit Mathur</title>
<defs>
  <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#03140a"/><stop offset="1" stop-color="#020805"/></linearGradient>
  <linearGradient id="line"><stop stop-color="#00ff41" stop-opacity="0"/><stop offset=".5" stop-color="#00ff41"/><stop offset="1" stop-color="#00ff41" stop-opacity="0"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .rain{font:16px monospace;fill:#00ff41;opacity:.45;animation:fall 8s linear infinite}
    .rain2{animation-delay:-4s;opacity:.22}
    .pulse{animation:pulse 2.8s ease-in-out infinite}
    @keyframes fall{from{transform:translateY(-220px)}to{transform:translateY(420px)}}
    @keyframes pulse{50%{opacity:.35}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <clipPath id="clip"><rect width="1200" height="390" rx="18"/></clipPath>
</defs>
