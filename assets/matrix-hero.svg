<g class="rain rain2"><text x="100" y="80">ﾆ 0 1 ﾖ ﾑ 10 ﾂ 01 ﾊ ﾈ 1 0 ﾛ</text><text x="360" y="80">01 ﾐ ﾊ 10 ﾈ 01 ﾑ ﾖ 1 ﾂ 0 ﾛ</text><text x="650" y="80">ﾖ 1 0 ﾂ ﾊ 01 ﾈ ﾑ 10 ﾛ 1 ﾐ</text><text x="920" y="80">10 ﾊ 01 ﾖ ﾑ ﾈ 1 ﾂ 0 ﾛ 01</text></g>
<rect x="1" y="1" width="1198" height="388" rx="17" fill="none" stroke="#08752b" stroke-width="2"/>
<path d="M40 315H1160" stroke="url(#line)" stroke-width="2"/>
<circle cx="600" cy="125" r="84" fill="none" stroke="#00ff41" stroke-width="1.5" stroke-dasharray="5 9" class="pulse"/>
<circle cx="600" cy="125" r="72" fill="#031a0b" stroke="#00ff41" stroke-width="2" filter="url(#glow)"/>
