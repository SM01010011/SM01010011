<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 18" role="img" aria-label="Animated green divider">
<defs><linearGradient id="g"><stop stop-color="#00ff41" stop-opacity="0"/><stop offset=".5" stop-color="#00ff41" stop-opacity=".8"/><stop offset="1" stop-color="#00ff41" stop-opacity="0"/></linearGradient>
<style>.move{animation:m 4s linear infinite}@keyframes m{from{transform:translateX(-260px)}to{transform:translateX(1200px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs>
<rect y="8" width="1200" height="2" fill="url(#g)"/><rect class="move" y="6" width="260" height="5" rx="2" fill="#00ff41"/></svg>