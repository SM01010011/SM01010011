<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 20" width="1200" height="20" role="img" aria-label="divider">
<defs>
  <style>
    .run{animation:run 5s linear infinite}
    @keyframes run{0%{transform:translateX(-220px)}75%,100%{transform:translateX(1220px)}}
    .dia{animation:p 2.4s ease-in-out infinite;transform-origin:600px 10px}
    @keyframes p{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.25)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00ff41" stop-opacity="0"/>
    <stop offset=".5" stop-color="#00ff41" stop-opacity=".45"/>
    <stop offset="1" stop-color="#00ff41" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="pg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00ff41" stop-opacity="0"/>
    <stop offset=".8" stop-color="#00ff41" stop-opacity=".9"/>
    <stop offset="1" stop-color="#d9ffe3"/>
  </linearGradient>
  <filter id="g" x="-50%" y="-300%" width="200%" height="700%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="0" y="9.25" width="1200" height="1.5" fill="url(#base)"/>
<rect class="run" x="0" y="9" width="220" height="2" fill="url(#pg)" filter="url(#g)"/>
<path class="dia" d="M600 4 L606 10 L600 16 L594 10Z" fill="#00ff41" filter="url(#g)"/>
</svg>
